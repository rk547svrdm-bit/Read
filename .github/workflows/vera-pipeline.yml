name: VERA Pipeline Giornaliera

on:
  schedule:
    # 06:00 UTC = 08:00 CEST (UTC+2)
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  pipeline:
    name: Esegui pipeline multi-agente VERA
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configura Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installa le dipendenze Python
        run: pip install anthropic google-generativeai openai

      - name: Esegui l'orchestratore VERA
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python fakenews/pipeline/orchestrator.py

      - name: Configura git per il commit
        run: |
          git config user.name "VERA Pipeline"
          git config user.email "vera-pipeline@users.noreply.github.com"

      - name: Aggiungi i file dati aggiornati
        run: git add fakenews/data/

      - name: Commit e push della smentita del giorno
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git diff --cached --quiet || git commit -m "VERA: smentita del $(date +%Y-%m-%d)"
          git push
